# ==========================================
# 三、 逻辑与控制配置 (Tracker & Planner)[cite: 1]
# ==========================================

#####----- 状态机参数 (Tracker) -----#####
enemy_color: "blue"            # 敌方颜色，可选 "red", "blue", "auto" (自动读取电控发来的颜色)
min_detect_count: 3           # 连续识别几帧后从 detecting 进入 tracking
max_temp_lost_count: 10       # 丢失几帧后从 temp_lost 彻底判定为 lost

#####----- 弹道与预测参数 (Planner) -----#####
yaw_offset: 0.061           # 12m/16m 联合拟合的无穷远固定 yaw 残差 (度)
pitch_offset: -0.195        # 12m/16m 联合拟合的无穷远固定 pitch 残差 (度)
# 米制横向/纵向视差项；运行时分别以 atan2(offset_m, target_distance) 转成角度。
yaw_distance_offset_m: -0.088
pitch_distance_offset_m: 0.096

# 激光参考点误差闭环：参考点由标定激光射线按目标距离动态投影到图像，
# PI 项消除不同视角下相对该点的剩余 dx/dy；画面中心不再是锁定参考点。
# 误差超过门限时拒绝该帧，最终修正角被限制在 +/-0.6 度以内。
visual_servo_enabled: true
visual_servo_kp: 0.65
visual_servo_ki: 0.8
visual_servo_max_correction_deg: 0.6
visual_servo_max_correction_rate_deg_s: 1.5
visual_servo_error_limit_px: 200.0
visual_servo_deadband_px: 1.5
# 横向速度超过该值时冻结积分，避免把移动滞后当成静态安装误差。
visual_servo_integral_speed_threshold_mps: 0.08
# 允许重启后约 40--50 px 的静态残差进入积分；移动状态仍由速度和稳定时间门限拦截。
visual_servo_integral_error_limit_px: 80.0
# 必须连续低速稳定 0.8 秒才开启积分，避免目标换向瞬间被误判为静止。
visual_servo_integral_settle_time_s: 0.8
# 左右移动日志拟合的安装倾斜耦合项，单位为“修正角度/相对 yaw 角度”。
# 只使用相对 yaw，因此电控重新上电导致的绝对零点变化不会改变该项。
visual_servo_yaw_correction_per_yaw: -0.1100
visual_servo_pitch_correction_per_yaw: 0.0686
xyz_offset: [0,0,0]   # PnP 后 xyz 固定偏移 (米), [x, y, z]
fire_thresh: 0.1              # 允许开火的角度误差阈值 (度)

# 高低速判断与预测延迟补偿 (秒)
gimbal_control_delay: 0.100    # 加入指令平滑后，动态日志拟合出约 25 ms 的额外滞后
# 两次真实视觉结果之间插入的卡尔曼预测控制帧数；0=不额外插帧，1=插入1帧，2=插入2帧
prediction_frames_between_detections: 3

# 最终瞄准角的二阶临界阻尼平滑；抑制移动时 PnP/EKF 带来的高频指令变化。
command_smoothing_enabled: true
command_smoothing_time_constant_s: 0.06
command_max_yaw_velocity_deg_s: 12.0
command_max_pitch_velocity_deg_s: 8.0
command_max_yaw_acceleration_deg_s2: 100.0
command_max_pitch_acceleration_deg_s2: 80.0

#####----- MPC 求解器参数 (TinyMPC) -----#####
max_yaw_acc: 50.0             # Yaw 轴最大加速度限制
Q_yaw: [9e6, 0.0]             # Yaw 状态代价值 (位置，速度)
R_yaw: [1.0]                  # Yaw 控制代价值

max_pitch_acc: 100.0          # Pitch 轴最大加速度限制
Q_pitch: [9e6, 0.0]           # Pitch 状态代价值 (位置，速度)
R_pitch: [1.0]                # Pitch 控制代价值

pattern_cols: 11      # 棋盘格每行的内角点数（格子数-1）
pattern_rows: 8      # 棋盘格每列的内角点数（格子数-1）
square_size_mm: 30   # 棋盘格方块大小（毫米）

# 使用 23 张、8.9--17.2 m 棋盘格样本拟合并通过质量门限的实际激光射线。
# 路径相对于本配置文件；运行时同时用它求解云台角度和视觉闭环参考像素。
laser_ray_enabled: true
laser_ray_config_path: ../assets/laser_ray_calibration_20260805/laser_ray.yaml



