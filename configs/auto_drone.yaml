# ==========================================
# 一、 硬件 IO 配置 (相机与下位机通信)
# ==========================================

#####----- 相机参数 (io::Camera) -----#####
camera_name: "hikrobot"       # 可选: "hikrobot", "daheng", "mindvision", "usbcamera"
camera_sn: "DA9784621"        # 相机序列号 (海康/大恒必须)
exposure_us: 15000             # 曝光时间 (微秒，打无人机建议适当调低防拖影)
gain: 1                     # 增益
vid_pid: "2bdf:0001"          # USB 设备的 VID:PID
flip: true                    # 图像上下翻转
mirror: true                  # 图像左右镜像
timestamp_offset_us: 2000     # 软硬件时间戳同步补偿 (微秒)

#####----- 串口云台参数 (io::Gimbal) -----#####
com_port: "/dev/ttyUSB0"      # 串口号
# 陀螺仪轴向重映射 (0代表y, 1代表p, 2代表r, 负号代表反向)
gimbal_y1: 1
gimbal_p2: 2
gimbal_r3: 3


# ==========================================
# 二、 视觉算法核心配置 (YOLO & Solver)
# ==========================================

#####----- 神经网络参数 (YOLO) -----#####
model_path: "/home/lzhros/race/sp_vision_25_rbclone_new/assets/module_labgame_demo.engine"  # TensorRT 10.11 engine 路径

#####----- 坐标系与相机内参 (Solver) -----#####
# 云台到 IMU 机体的旋转矩阵（3x3 行优先）。
# 由上方 yaw 电机轴和左侧 pitch 电机轴实测后正交化；yaw 轴相对 IMU Z 倾斜约 19.45 度。
R_gimbal2imubody: [-0.942866495480, -0.038152443966, -0.330979097105, 0.027506654139, -0.998944344435, 0.036791041012, -0.332033365310, 0.025584912352, 0.942920599298]

# 相机光轴相对理想云台坐标约为 yaw +2.03、pitch +18.98 degree。
# 旋转使用 59 组手眼数据的 Park/Horaud 一致解；平移因 50 mm 窄视场退化，改用机械测量。
R_camera2gimbal: [-0.040421293314026, 0.324421929857806, 0.945048427595651, -0.975158375276931, -0.218967173836949, 0.033459227563082, 0.217789490504245, -0.920219423947863, 0.325213698381750]
# 相机光心位于电机轴交点前方约 4.5 cm、左右近似 0、下方约 5 cm。
t_camera2gimbal: [0.045, 0.0, -0.050]
# 重投影误差: 0.1181px
camera_matrix: [14955.275481254272, 0, 424.5275247834595, 0, 14917.483385201438, 890.1436041583838, 0, 0, 1]
distort_coeffs: [0.259455463319462, 7.781591144598162, 0.014803400834467228, -0.017879580487416027, 0.15829957121310623]

# # 重投影误差: 0.1047px
