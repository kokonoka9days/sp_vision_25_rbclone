# distort_coeffs: [0.9096722233440737, -19.817653943016595, 0.00026154597798432505, -0.07489773004933406, 331.98641654955406]
# # 相机同理想情况的偏角: yaw-2.12 pitch-1.23 roll-1.60 degree
# # 标定板到世界坐标系原点的水平距离: 11.30 m
